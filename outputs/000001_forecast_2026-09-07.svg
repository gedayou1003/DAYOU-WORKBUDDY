<line class="grid" x1="20" y1="110.8" x2="600" y2="110.8"/>
<text class="label" x="14" y="113.8" text-anchor="end">3950</text>
<line class="grid" x1="20" y1="80.0" x2="600" y2="80.0"/>
<text class="label" x="14" y="83.0" text-anchor="end">3960</text>

<!-- y 轴 -->
<line class="axis" x1="20" y1="40" x2="20" y2="490"/>
<!-- x 轴分区 -->
<line class="grid" x1="240" y1="40" x2="240" y2="490" stroke="#a89e87" stroke-dasharray="3 4"/>
<text x="130" y="510" text-anchor="middle" class="label">9/4 实况</text>
<text x="420" y="510" text-anchor="middle" class="label">9/7 今日预判 · 震荡区间 · 变盘路径</text>

<!-- 已走路径（9/4 OHLC） -->
<path class="actual" d="M 20.0,216.76 L 100.0,140.91 L 170.0,340.86 L 240.0,295.01"/>
<circle cx="20" cy="216.76" r="3" fill="#1f3a3a"/>
<text class="ts" x="18" y="230.76" text-anchor="end" fill="#1a5a3a">O 3955.55</text>
<circle cx="100" cy="140.91" r="3" fill="#b33a1f"/>
<text class="ts" x="104" y="136.91" fill="#b33a1f">H 3980.20</text>
<circle cx="170" cy="340.86" r="3" fill="#1a7a3a"/>
<text class="ts" x="174" y="354.86" fill="#1a7a3a">L 3915.22</text>
<circle cx="240" cy="295.01" r="3" fill="#1f3a3a"/>
<text class="ts" x="228" y="287.01" text-anchor="end" fill="#1f3a3a">C 3930.12</text>

<!-- 当日关键信号（左上） -->
<text x="22" y="48.0" class="tb" fill="#b33a1f">▸ 9/4 实况关键信号</text>
<text x="24" y="63.0" class="ts" fill="#5a5a4f">· 9/4 冲高 3980.20 后失守 60F55</text>
<text x="24" y="78.0" class="ts" fill="#5a5a4f">· 剧本 B 几近完美：最低 3915.22（距 3911 仅 4 点）</text>
<text x="24" y="93.0" class="ts" fill="#5a5a4f">· 60F 三卖@3911.08 conf0.75 压制上方</text>

<!-- 震荡带（3930-3958） -->
<rect x="240" y="200.0" width="360" height="95.0" fill="#f3eddd" opacity="0.55"/>
<text class="ts" x="592" y="270.0" text-anchor="end" fill="#8a7a55">核心带 3930-3958</text>

<!-- 现价锚点 -->
<circle cx="240" cy="295.01" r="4.5" fill="#2b2b2b"/>
<text class="tb" x="234" y="287.01" text-anchor="end" fill="#2b2b2b">现价 3930.12</text>

<!-- 关键位水平线 -->
<!-- 支撑线（绿色虚线） -->
<line x1="20" y1="295.01" x2="600" y2="295.01" stroke="#1a7a3a" stroke-width="0.7" stroke-dasharray="2 3" opacity="0.75"/>
<text class="ts" x="610" y="298.0" fill="#1a7a3a">SUPP 3930.00 60F55线·T&J锚点</text>
<line x1="20" y1="302.92" x2="600" y2="302.92" stroke="#1a7a3a" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.65"/>
<text class="ts" x="610" y="306.0" fill="#1a7a3a">SUPP 3927.55 60F中枢下沿</text>
<line x1="20" y1="353.6" x2="600" y2="353.6" stroke="#1a7a3a" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.65"/>
<text class="ts" x="610" y="356.6" fill="#1a7a3a">SUPP 3911.08 60F三卖（远端）</text>

<!-- 压力线（橙色虚线） -->
<line x1="20" y1="223.84" x2="600" y2="223.84" stroke="#b33a1f" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.65"/>
