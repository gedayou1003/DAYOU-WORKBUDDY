<line x1="20" y1="208.42" x2="600" y2="208.42" stroke="#b33a1f" stroke-width="0.7" stroke-dasharray="2 3" opacity="0.75"/>
<text class="ts" x="610" y="211.42" fill="#b33a1f">RESIST 3958.26 60F中轨·多空分水岭</text>
<line x1="20" y1="179.72" x2="600" y2="179.72" stroke="#b33a1f" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.65"/>
