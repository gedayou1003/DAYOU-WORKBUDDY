<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 0 940 600" font-family="-apple-system,'PingFang SC',sans-serif">
<defs><style>
.grid{stroke:#d8d2c4;stroke-width:0.5;stroke-dasharray:2 3}
.axis{stroke:#3a4a4a;stroke-width:1;fill:none}
.label{fill:#3a4a4a;font-size:10px}
.actual{stroke:#1f3a3a;stroke-width:2.2;fill:none}
.node-up{fill:#fdf0ec;stroke:#b33a1f;stroke-width:2}
.node-dn{fill:#edf5ee;stroke:#1a7a3a;stroke-width:2}
.tt{font-size:11px;font-weight:700}
.tb{font-size:10px}
.ts{font-size:9px}
</style></defs>

<!-- 标题 -->
<text x="430" y="18" text-anchor="middle" class="tt" fill="#1f3a3a" font-size="15">上证综指 2026-09-07 预判 · 震荡偏多（政策催化 + 技术压制）· v5</text>

<!-- y 轴网格 (3870-4000, 每 10 点) -->
