<line class="grid" x1="20" y1="295.4" x2="600" y2="295.4"/>
<text class="label" x="14" y="298.4" text-anchor="end">3910</text>
<line class="grid" x1="20" y1="264.6" x2="600" y2="264.6"/>
<text class="label" x="14" y="267.6" text-anchor="end">3920</text>
<line class="grid" x1="20" y1="233.9" x2="600" y2="233.9"/>
<text class="label" x="14" y="236.9" text-anchor="end">3930</text>
<line class="grid" x1="20" y1="172.3" x2="600" y2="172.3"/>
