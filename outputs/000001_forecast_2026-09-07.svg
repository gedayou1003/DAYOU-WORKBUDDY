<line x1="20" y1="140.91" x2="600" y2="140.91" stroke="#b33a1f" stroke-width="0.7" stroke-dasharray="2 3" opacity="0.75"/>
<text class="ts" x="610" y="143.91" fill="#b33a1f">RESIST 3980.20 T&J拒绝X段</text>

<!-- 三剧本路径 -->

<!-- 剧本 B：政策利好但技术压制震荡 45%（最可能） -->
<path d="M 240.0,295.01 L 320.0,260.0 L 400.0,225.0 L 480.0,250.0 L 600.0,235.0" stroke="#8a8a80" stroke-width="2.5" fill="none" stroke-dasharray="4 3"/>
<text class="tb" x="335" y="275.0" fill="#6a6a5f">剧本 B · 震荡 45%（最可能）</text>
<text class="ts" x="490" y="222.0" fill="#6a6a5f">3930-3958 磨一天 · 冲高乏力</text>

<!-- 剧本 A：政策催化反弹 30% -->
<polygon class="node-up" points="420.0,252.0 431.0,263.0 420.0,274.0 409.0,263.0"/>
<path d="M 420.0,263.0 L 510.0,179.72 L 600.0,140.91" stroke="#b33a1f" stroke-width="2.5" fill="none"/>
<polygon points="600,132.91 608,140.91 600,148.91 592,140.91" fill="#b33a1f"/>
<text class="tb" x="436.0" y="256.0" fill="#b33a1f">剧本 A · 反弹 30%</text>
<text class="ts" x="490" y="177.0" fill="#b33a1f">放量过 3958 → 看 3967/3980</text>

<!-- 剧本 C：政策利好兑现失败 25% -->
<polygon class="node-dn" points="420.0,322.0 431.0,333.0 420.0,344.0 409.0,333.0"/>
<path d="M 420.0,333.0 L 510.0,353.6 L 600.0,471.14" stroke="#1a7a3a" stroke-width="2.2" fill="none"/>
<polygon points="600,463.14 608,471.14 600,479.14 592,471.14" fill="#1a7a3a"/>
<text class="tb" x="436.0" y="346.0" fill="#1a7a3a">剧本 C · 跌破 25%</text>
<text class="ts" x="490" y="350.0" fill="#1a7a3a">失守 3930 → 看 3911/3872</text>

<!-- 决策菱形：60F 中轨 3958 -->
<polygon points="420,200 432,212 420,224 408,212" fill="#fffdf6" stroke="#b33a1f" stroke-width="2"/>
