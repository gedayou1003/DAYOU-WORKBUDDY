<text x="627" y="68" class="tb" fill="#1f3a3a">盘面应对（v5 纪律）</text>
<text x="627" y="88" class="ts" fill="#b33a1f">▸ A 反弹 30%：放量过 3958 → 追多</text>
<text x="627" y="103" class="ts" fill="#b33a1f">           看 3967 / 3980</text>
<text x="627" y="123" class="ts" fill="#6a6a5f">▸ B 震荡 45%：3930-3958 不追涨杀跌</text>
<text x="627" y="143" class="ts" fill="#1a7a3a">▸ C 跌破 25%：失守 3930 → 减仓</text>
<text x="627" y="158" class="ts" fill="#1a7a3a">           看 3911 / 3872</text>
<text x="627" y="178" class="ts" fill="#5a5a4f">▸ 锚点：3930 是 T&J 锚点+60F55</text>
<text x="627" y="193" class="ts" fill="#5a5a4f">▸ 决策：3958 是 60F 中轨（多空分水岭）</text>
<text x="627" y="208" class="ts" fill="#5a5a4f">▸ 信号：T&J 9/6 22:35 周末定调</text>
<text x="627" y="223" class="ts" fill="#5a5a4f">▸ 催化：财政部 3600 亿注资金融央企</text>
<text x="627" y="238" class="ts" fill="#5a5a4f">▸ 警示：失守 3930 = X段反抽证伪</text>
</g>

